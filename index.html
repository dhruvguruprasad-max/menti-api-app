<!-- Surprise discount widget (with confetti + brain icon) -->
<button class="surprise-btn" id="surpriseBtn" aria-controls="surpriseCard" aria-expanded="false" title="Surprise here!">
  <!-- brain icon -->
  <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M22 20a10 10 0 0 1 20 0 10 10 0 0 1 10 10 10 10 0 0 1-10 10 10 10 0 0 1-20 0 10 10 0 0 1-10-10 10 10 0 0 1 10-10z" stroke="#fff" stroke-width="3"/>
  </svg>
  Surprise
</button>

<div class="surprise-card" id="surpriseCard" role="dialog" aria-label="Discount code">
  <div style="font-weight:800; margin-bottom:6px;">🎁 10% off for you!</div>
  <div class="code-box">
    <span id="codeText">MENTI10</span>
    <button id="copyBtn" style="border:none;background:#0f1115;color:#fff;border-radius:8px;padding:6px 8px;cursor:pointer">Copy</button>
  </div>
  <a class="apply-btn" id="applyBtn" href="https://dhruvprasad.gumroad.com/l/lghflw?offer_code=MENTI10" target="_blank" rel="noopener">Apply & Upgrade</a>
  <div class="mini">Code auto-applies on checkout.</div>
</div>

<!-- Confetti + Surprise logic -->
<script>
  // Confetti function
  function launchConfetti(){
    const duration = 2 * 1000;
    const end = Date.now() + duration;
    const colors = ['#0FD3A0','#B68CFF','#ffffff','#89f0c5'];

    (function frame() {
      const timeLeft = end - Date.now();
      if (timeLeft <= 0) return;
      const particleCount = 6 * (timeLeft / duration);
      confetti({
        particleCount,
        startVelocity: 40,
        spread: 90,
        ticks: 60,
        origin: { x: Math.random(), y: Math.random() - 0.2 },
        colors: colors
      });
      requestAnimationFrame(frame);
    })();
  }

  // Load confetti script
  (function loadConfetti(){
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js';
    document.head.appendChild(script);
  })();

  const sBtn=document.getElementById('surpriseBtn'),
        sCard=document.getElementById('surpriseCard'),
        copyBtn=document.getElementById('copyBtn'),
        codeText=document.getElementById('codeText');

  sBtn.addEventListener('click',()=>{
    const show=!sCard.classList.contains('show');
    sCard.classList.toggle('show',show);
    sBtn.setAttribute('aria-expanded',show?'true':'false');
    if(show) launchConfetti();
  });

  copyBtn.addEventListener('click',async()=>{
    try{
      await navigator.clipboard.writeText(codeText.textContent.trim());
      copyBtn.textContent='Copied!';
      setTimeout(()=>copyBtn.textContent='Copy',1200);
    }catch{
      copyBtn.textContent='Select & copy';
    }
  });

  document.addEventListener('click',(e)=>{
    const within=sCard.contains(e.target)||sBtn.contains(e.target);
    if(!within) sCard.classList.remove('show');
  },true);
</script>
